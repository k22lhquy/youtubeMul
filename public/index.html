<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncScreen — xem cùng nhau</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <section class="hero" id="lobby">
        <p class="eyebrow">SYNCED WATCH PARTY</p>
        <h1>Xem cùng một khoảnh khắc.</h1>
          <p class="lede" id="room-intro">Tạo phòng, gửi link, cùng xem video. Bản đầu dùng URL video công khai.</p>
        <form id="room-form" class="card">
          <label>
            Tên hiển thị
            <input id="name" maxlength="32" placeholder="Quy" required />
          </label>
          <label>
            URL video MP4/HLS <span id="video-required">(host nhập)</span>
            <input id="video-url" type="url" placeholder="https://.../movie.mp4 hoặc .m3u8" required />
          </label>
          <button id="join-button">Tạo phòng</button>
        </form>
      </section>

      <section class="watch hidden" id="watch-room" aria-live="polite">
        <header class="topbar">
          <a class="brand" href="/">SYNCSCREEN</a>
          <span id="room-code"></span>
          <button class="copy" id="copy-link" type="button">Sao chép link mời</button>
        </header>
        <div class="stage">
          <video id="player" controls playsinline></video>
          <aside>
            <span class="status" id="sync-status"><i></i> Đang kết nối</span>
            <h2 id="movie-title">Video của phòng</h2>
            <p id="host-note">Host điều khiển. Máy khác tự sửa lệch thời gian.</p>
            <div class="people" id="people"></div>
            <label class="change-video hidden" id="change-video">
              Đổi video
              <input id="new-video-url" type="url" placeholder="https://..." />
              <button id="change-video-button" type="button">Đổi video</button>
            </label>
          </aside>
        </div>
      </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/hls.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
