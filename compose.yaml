services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: syncscreen
      POSTGRES_USER: syncscreen
      POSTGRES_PASSWORD: syncscreen-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncscreen -d syncscreen"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
